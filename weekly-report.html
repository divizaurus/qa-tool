<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Weekly Report Generator</title>
<style>
  :root{
    --bg:#12161b;
    --surface:#191f26;
    --surface-2:#1f2730;
    --border:#2a323d;
    --text:#e7eaee;
    --muted:#8b96a3;
    --accent:#49c9a8;
    --accent-dim:#2f6f60;
    --amber:#e0a94a;
    --red:#e07a63;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height:100vh;
  }
  .topbar{
    padding:18px 28px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:baseline;
    gap:14px;
  }
  .topbar h1{
    font-family:'IBM Plex Mono', monospace;
    font-size:16px;
    letter-spacing:0.02em;
    margin:0;
    color:var(--text);
  }
  .topbar .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--accent);
    background:rgba(73,201,168,0.1);
    border:1px solid var(--accent-dim);
    padding:2px 8px;
    border-radius:3px;
  }
  .layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
    min-height:calc(100vh - 58px);
  }
  @media (max-width: 940px){
    .layout{grid-template-columns:1fr;}
  }
  .pane{padding:24px 28px;}
  .pane.left{border-right:1px solid var(--border);}
  .pane.right{
    background:var(--surface);
    position:sticky;
    top:0;
    align-self:start;
    max-height:100vh;
    overflow-y:auto;
  }
  section{margin-bottom:26px;}
  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .section-head h2{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin:0;
  }
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:4px;
  }
  input[type=text], input[type=date], textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:4px;
    color:var(--text);
    padding:8px 10px;
    font-family:inherit;
    font-size:13px;
    margin-bottom:10px;
  }
  input[type=text]:focus, input[type=date]:focus, textarea:focus{
    outline:none;
    border-color:var(--accent-dim);
  }
  textarea{resize:vertical; min-height:44px;}
  .row-inline{display:flex; gap:8px;}
  .row-inline > div{flex:1;}

  .area-block{
    border:1px solid var(--border);
    border-radius:6px;
    padding:12px;
    margin-bottom:10px;
    background:var(--surface-2);
  }
  .area-block .row-inline{margin-bottom:8px;}
  .area-block input[type=text]{margin-bottom:0;}

  .list-item{
    display:flex;
    gap:8px;
    margin-bottom:8px;
    align-items:flex-start;
  }
  .list-item textarea, .list-item input{margin-bottom:0; flex:1;}

  button{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    cursor:pointer;
    border-radius:4px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--muted);
    padding:6px 10px;
    transition:border-color .15s, color .15s;
  }
  button:hover{border-color:var(--accent-dim); color:var(--accent);}
  button.danger:hover{border-color:#7a3c33; color:var(--red);}
  button.add{
    color:var(--accent);
    border-color:var(--accent-dim);
    width:100%;
    margin-top:2px;
  }
  button.remove{
    flex:0 0 auto;
    padding:6px 8px;
  }

  .copy-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .copy-bar h2{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin:0;
  }
  #copyBtn{
    background:var(--accent-dim);
    color:#eafff8;
    border-color:var(--accent-dim);
    padding:7px 14px;
  }
  #copyBtn:hover{border-color:var(--accent); background:var(--accent);}
  #copyBtn.copied{background:var(--accent); border-color:var(--accent);}

  #preview{
    white-space:pre-wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    line-height:1.65;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:6px;
    padding:16px 18px;
    color:var(--text);
  }
  #preview b{color:var(--accent);}
  #preview a{
    color:var(--accent);
    text-decoration:none;
    border-bottom:1px dotted var(--accent-dim);
  }
  #preview a:hover{border-bottom-color:var(--accent);}

  .hint{
    font-size:11px;
    color:var(--muted);
    margin-top:-4px;
    margin-bottom:10px;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>QA Weekly Report Generator</h1>
  <span class="tag">dot.cards</span>
</div>

<div class="layout">
  <div class="pane left">

    <section>
      <div class="section-head"><h2>Period</h2></div>
      <div class="row-inline">
        <div>
          <label>Start date</label>
          <input type="date" id="startDate">
        </div>
        <div>
          <label>End date</label>
          <input type="date" id="endDate">
        </div>
      </div>
    </section>

    <section>
      <div class="section-head"><h2>🎯 Feature Focus</h2></div>
      <label>One line per focus item</label>
      <textarea id="featureFocus" placeholder="Signature - Testing Done, Release ready">Signature - Testing Done, Release ready</textarea>
    </section>

    <section>
      <div class="section-head">
        <h2>✅ Tested (by area)</h2>
      </div>
      <div id="areaList"></div>
      <button class="add" onclick="addArea()">+ Add area</button>
    </section>

    <section>
      <div class="section-head"><h2>🎫 Tickets / Issues submitted</h2></div>
      <label>Jira filter or issues link</label>
      <input type="text" id="ticketsLink" placeholder="https://dotcards.atlassian.net/issues/?filter=10310">
      <label>Jira base URL (ticket IDs like DD-4454 auto-link to here)</label>
      <input type="text" id="jiraBase" value="https://dotcards.atlassian.net/browse/">
      <div class="hint">Copy uses rich text, so links survive pasting into Notion/Slack/Docs. Plain-text paste targets still get the readable ID.</div>
    </section>

    <section>
      <div class="section-head"><h2>🚀 Releases</h2></div>
      <div id="releaseList"></div>
      <button class="add" onclick="addLine('releaseList','e.g. Express Release - fixes for the sign-up issue')">+ Add release</button>
    </section>

    <section>
      <div class="section-head"><h2>🚧 Blockers</h2></div>
      <div id="blockerList"></div>
      <button class="add" onclick="addLine('blockerList','e.g. Backend for Image gallery not implemented')">+ Add blocker</button>
    </section>

    <section>
      <div class="section-head"><h2>⏳ Carrying into next week</h2></div>
      <div id="carryList"></div>
      <button class="add" onclick="addLine('carryList','What\'s open/blocked + why')">+ Add item</button>
    </section>

  </div>

  <div class="pane right">
    <div class="copy-bar">
      <h2>Preview</h2>
      <button id="copyBtn" onclick="copyOutput()">Copy to clipboard</button>
    </div>
    <div id="preview"></div>
  </div>
</div>

<script>
let areaCount = 0;
const defaultAreas = [
  {name:'Signature', tickets:'DD-6298, DD-6315, DD-6319, DD-6325'},
  {name:'Shopify', tickets:'Profile+ through Meta Ads, International Orders issues with the free Wallet, Stop the Profile+ in cart experiment, 6 Years Anniversary'},
  {name:'Mobile', tickets:'DD-6049, DD-6319'},
  {name:'Insights', tickets:'DD-5909, DD-6327, DD-5924'},
  {name:'High Prio', tickets:'DD-6316'}
];

function addArea(name='', tickets=''){
  areaCount++;
  const id = 'area_' + areaCount;
  const wrap = document.createElement('div');
  wrap.className = 'area-block';
  wrap.id = id;
  wrap.innerHTML = `
    <div class="row-inline">
      <input type="text" placeholder="Area name (e.g. Signature)" value="${escapeAttr(name)}" oninput="renderPreview()">
      <button class="remove danger" onclick="document.getElementById('${id}').remove(); renderPreview();">✕</button>
    </div>
    <textarea placeholder="Ticket IDs / items, comma separated" oninput="renderPreview()">${tickets}</textarea>
  `;
  document.getElementById('areaList').appendChild(wrap);
  renderPreview();
}

function addLine(listId, placeholder){
  const wrap = document.createElement('div');
  wrap.className = 'list-item';
  wrap.innerHTML = `
    <textarea placeholder="${placeholder}" oninput="renderPreview()"></textarea>
    <button class="remove danger" onclick="this.parentElement.remove(); renderPreview();">✕</button>
  `;
  document.getElementById(listId).appendChild(wrap);
  renderPreview();
}

function escapeAttr(s){
  return (s||'').replace(/"/g,'&quot;');
}

function buildDateRange(start, end){
  if(!start || !end) return '';
  const startD = new Date(start + 'T00:00:00');
  const endD = new Date(end + 'T00:00:00');

  const startDay = startD.getDate();
  const endDay = endD.getDate();
  const startMonth = startD.toLocaleString('en-US', {month:'long'});
  const endMonth = endD.toLocaleString('en-US', {month:'long'});
  const startYear = startD.getFullYear();
  const endYear = endD.getFullYear();

  if(startYear !== endYear){
    return `${startDay} ${startMonth} ${startYear} - ${endDay} ${endMonth} ${endYear}`;
  }
  if(startMonth !== endMonth){
    return `${startDay} ${startMonth} - ${endDay} ${endMonth} ${endYear}`;
  }
  return `${startDay}-${endDay} ${endMonth} ${endYear}`;
}

function collectLines(listId){
  return Array.from(document.querySelectorAll(`#${listId} textarea`))
    .map(t=>t.value.trim())
    .filter(Boolean);
}

function buildText(){
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;
  const dateRange = buildDateRange(start, end);

  const focusLines = document.getElementById('featureFocus').value
    .split('\n').map(s=>s.trim()).filter(Boolean);

  let out = `📋 QA Weekly Update — ${dateRange}\n`;
  out += `🎯 Feature Focus: ${focusLines.map(l=>'- ' + l).join(' ')}\n`;
  out += `✅ Tested:\n`;

  document.querySelectorAll('.area-block').forEach(block=>{
    const name = block.querySelector('input[type=text]').value.trim();
    const tickets = block.querySelector('textarea').value.trim();
    if(name || tickets){
      out += `${name}: ${tickets}\n`;
    }
  });

  const ticketsLink = document.getElementById('ticketsLink').value.trim();
  if(ticketsLink){
    out += `Tickets/Issues submitted: ${ticketsLink}\n`;
  }

  const releases = collectLines('releaseList');
  out += `Releases:\n`;
  if(releases.length){
    releases.forEach(r=>out += `${r}\n`);
  }

  const blockers = collectLines('blockerList');
  out += `Blockers:\n`;
  if(blockers.length){
    blockers.forEach(b=>out += `${b}\n`);
  } else {
    out += `None\n`;
  }

  out += `⏳ Carrying into next week: [what's open/blocked + why]\n`;
  const carry = collectLines('carryList');
  carry.forEach(c=>out += `${c}\n`);

  return out.trim();
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Standard Jira issue key shape: one or more letters, then -, then digits (e.g. DD-4454)
const TICKET_RE = /\b[A-Z][A-Z0-9]{1,9}-\d+\b/g;

function getJiraBaseUrl(){
  let v = document.getElementById('jiraBase').value.trim();
  if(!v) v = 'https://dotcards.atlassian.net/browse/';
  if(!v.endsWith('/')) v += '/';
  return v;
}

const URL_RE = /\bhttps?:\/\/[^\s<]+/g;

function linkifyHtml(escapedText){
  const base = getJiraBaseUrl();
  // Links raw URLs first, then ticket IDs — skip ticket IDs already inside an <a> from the URL pass.
  let html = escapedText.replace(URL_RE, m => `<a href="${m}" target="_blank" rel="noopener">${m}</a>`);
  const parts = html.split(/(<a [^>]*>.*?<\/a>)/g);
  html = parts.map(part => {
    if(part.startsWith('<a ')) return part;
    return part.replace(TICKET_RE, m => `<a href="${base}${m}" target="_blank" rel="noopener">${m}</a>`);
  }).join('');
  return html;
}

function buildHtml(){
  const text = buildText();
  return linkifyHtml(escapeHtml(text)).replace(/\n/g, '<br>');
}

function renderPreview(){
  document.getElementById('preview').innerHTML = buildHtml();
}

async function copyOutput(){
  const text = buildText();
  const btn = document.getElementById('copyBtn');
  const original = btn.textContent;
  let success = false;

  // Attempt 1: modern async clipboard write with both plain + rich formats.
  try{
    if(navigator.clipboard && window.ClipboardItem){
      const html = buildHtml();
      const item = new ClipboardItem({
        'text/plain': new Blob([text], {type:'text/plain'}),
        'text/html': new Blob([html], {type:'text/html'})
      });
      await navigator.clipboard.write([item]);
      success = true;
    }
  } catch(e){ success = false; }

  // Attempt 2: select the rendered preview and use execCommand('copy').
  // This copies exactly what's on screen (including the <a> links) and is
  // far more reliably permitted by Safari on file:// pages than the async API.
  if(!success){
    try{
      const preview = document.getElementById('preview');
      const range = document.createRange();
      range.selectNodeContents(preview);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      success = document.execCommand('copy');
      sel.removeAllRanges();
    } catch(e){ success = false; }
  }

  // Attempt 3: last-resort plain text.
  if(!success){
    try{
      await navigator.clipboard.writeText(text);
      success = true;
    } catch(e){ success = false; }
  }

  if(success){
    btn.textContent = 'Copied ✓';
    btn.classList.add('copied');
  } else {
    btn.textContent = 'Copy failed — select manually';
  }
  setTimeout(()=>{ btn.textContent = original; btn.classList.remove('copied'); }, 1800);
}

// init defaults
function initDefaults(){
  const today = new Date();
  const weekAgo = new Date(today.getTime() - 7*86400000);
  document.getElementById('startDate').value = weekAgo.toISOString().slice(0,10);
  document.getElementById('endDate').value = today.toISOString().slice(0,10);

  defaultAreas.forEach(a => addArea(a.name, a.tickets));
  document.getElementById('ticketsLink').value = 'https://dotcards.atlassian.net/issues/?filter=10310';

  addLine('releaseList','');
  addLine('blockerList','');
  addLine('carryList','');

  renderPreview();
}

document.getElementById('featureFocus').addEventListener('input', renderPreview);
document.getElementById('ticketsLink').addEventListener('input', renderPreview);
document.getElementById('jiraBase').addEventListener('input', renderPreview);
document.getElementById('startDate').addEventListener('input', renderPreview);
document.getElementById('endDate').addEventListener('input', renderPreview);

initDefaults();
</script>

</body>
</html>
